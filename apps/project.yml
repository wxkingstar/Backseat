name: Backseat
options:
  deploymentTarget:
    watchOS: "11.0"
    iOS: "18.0"
configFiles:
  Debug: Config.local.xcconfig
  Release: Config.local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  BackseatWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.backseat.$(DEVELOPMENT_TEAM).watch
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Watch/Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Backseat
        WKApplication: true
        WKWatchOnly: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: 按住说话时录音，交给你的 Mac 转成文字发给 Claude。
        NSLocalNetworkUsageDescription: 连接你 Mac 上的 backseat，用来收提醒和发指令。
        NSHealthShareUsageDescription: 遥控模式借用「体能训练」会话让 App 在抬腕时保持在前台，不读取健康数据。
        NSHealthUpdateUsageDescription: 遥控模式借用「体能训练」会话保持后台运行，不会保存任何体能训练记录。
        WKBackgroundModes: [workout-processing]

  Backseat:
    type: application
    platform: iOS
    sources: [Phone, Shared, PhoneShared]
    dependencies:
      - target: BackseatWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.backseat.$(DEVELOPMENT_TEAM).phone
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: Backseat
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        CADisableMinimumFrameDurationOnPhone: true
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: 按住说话时录音，交给你的 Mac 转成文字。
        NSSpeechRecognitionUsageDescription: 连不上 Mac 时，在手机上把说的话转成文字，存进灵感收件箱。
        NSLocalNetworkUsageDescription: 连接你 Mac 上的 backseat，用来输入文字、滚动和审批。
        NSBonjourServices: [_backseat._tcp]

  BackseatWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, PhoneShared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.backseat.$(DEVELOPMENT_TEAM).phone.widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Backseat
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
